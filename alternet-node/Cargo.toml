[package]
name = "alternet-node"
version = "0.1.0"
edition = "2024"
description = "AlterNet headless seed/relay daemon"

[[bin]]
name = "alternet-node"
path = "src/main.rs"

[dependencies]
alternet-core = { path = "../alternet-core" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
